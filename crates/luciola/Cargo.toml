[package]
name = "luciola"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight, resilient LAN peer discovery and interface intelligence engine"

[dependencies]
luciola-ip = { path = "../luciola-ip", version = "0.7.0" }
luciola-net = { path = "../luciola-net", version = "0.7.0" }
luciola-proto = { path = "../luciola-proto", version = "0.7.0" }
luciola-transfer = { path = "../luciola-transfer", version = "0.7.0", optional = true }
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
percent-encoding.workspace = true
socket2.workspace = true
rand.workspace = true
zeroize.workspace = true

[features]
default = ["transfer"]
transfer = ["dep:luciola-transfer"]

[dev-dependencies]
luciola-net = { path = "../luciola-net", version = "0.7.0" }
network-interface = "2.0"
