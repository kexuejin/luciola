[package]
name = "luciola"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://kexuejin.github.io/luciola/"
documentation = "https://docs.rs/luciola"
keywords = ["p2p", "lan", "discovery", "ipv6", "peer-to-peer"]
categories = ["network-programming", "asynchronous"]
description = "Lightweight, resilient LAN peer discovery and interface intelligence engine"

[dependencies]
luciola-ip = { path = "../luciola-ip", version = "0.10.0" }
luciola-net = { path = "../luciola-net", version = "0.10.0" }
luciola-proto = { path = "../luciola-proto", version = "0.10.0" }
luciola-transfer = { path = "../luciola-transfer", version = "0.10.0", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
percent-encoding.workspace = true
socket2.workspace = true
rand.workspace = true
zeroize.workspace = true

[features]
default = ["transfer"]
transfer = ["dep:luciola-transfer"]

[dev-dependencies]
luciola-net = { path = "../luciola-net", version = "0.10.0" }
network-interface = "2.0"
