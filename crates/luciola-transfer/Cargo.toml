[package]
name = "luciola-transfer"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://kexuejin.github.io/luciola/"
documentation = "https://docs.rs/luciola-transfer"
keywords = ["file-transfer", "p2p", "chunked", "checksum", "networking"]
categories = ["network-programming", "filesystem"]
description = "Chunked file transfer data plane (offset-addressed writes, ACK prefix, SHA-256 receipt)"

[dependencies]
luciola-proto = { path = "../luciola-proto", version = "0.9.3" }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Circular on purpose (luciola re-exports this crate under the `transfer`
# feature): the E2E tests drive the data plane over a real SecureStream.
luciola = { path = "../luciola" }
