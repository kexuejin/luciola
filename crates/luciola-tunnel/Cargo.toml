[package]
name = "luciola-tunnel"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://kexuejin.github.io/luciola/"
documentation = "https://docs.rs/luciola-tunnel"
keywords = ["port-forwarding", "tcp", "udp", "mux", "p2p"]
categories = ["network-programming"]
description = "LAN TCP multiplexing (mux v2 with per-channel flow control, keepalive, remote forward, UDP mapping and hostname targets over a luciola SecureStream)"

[dependencies]
luciola = { path = "../luciola", version = "0.10.0" }
luciola-proto = { path = "../luciola-proto", version = "0.10.0" }
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "io-util"] }
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
