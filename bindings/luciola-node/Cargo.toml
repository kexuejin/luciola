[package]
name = "luciola-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js (N-API) bindings for the Luciola peer discovery and network intelligence engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "async"] }
napi-derive = "2.16"
luciola-ip = { path = "../../crates/luciola-ip" }
luciola-net = { path = "../../crates/luciola-net" }
luciola-proto = { path = "../../crates/luciola-proto" }
luciola = { path = "../../crates/luciola" }
tokio = { workspace = true }
rand = { workspace = true }

[build-dependencies]
napi-build = "2.1"
