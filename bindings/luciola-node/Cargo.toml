[package]
name = "luciola-node"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js (N-API) bindings for the Luciola peer discovery and network intelligence engine"

publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
napi = { version = "2.16", default-features = false, features = ["napi4", "async"] }
napi-derive = "2.16"
luciola-ip = { path = "../../crates/luciola-ip" }
luciola-net = { path = "../../crates/luciola-net" }
luciola-proto = { path = "../../crates/luciola-proto" }
luciola = { path = "../../crates/luciola" }
luciola-tunnel = { path = "../../crates/luciola-tunnel" }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util"] }
rand = { workspace = true }
qrcode = "0.14"

[build-dependencies]
napi-build = "2.1"
