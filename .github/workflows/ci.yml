name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个 OS 红了不能让另一个 OS 的结论消失：今天 macOS 的负载敏感用例
      # (luciola-transfer final_ack_loss_recovers_via_answer_cache, AGENTS.md §2)
      # 触发 fail-fast，把正在跑的 Windows job 直接 cancel 掉，于是「Windows 到底
      # 绿没绿」没有答案——这正是 §2 要求门禁区分「没验到」与「验坏了」的那条原则。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Tests
        run: cargo test --all-targets --all-features

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 1.88 is the floor the dependency tree itself enforces (image, napi-build,
      # textwrap all require rustc 1.88); every crate declares
      # rust-version = "1.88" via the workspace, so cargo fails the build here
      # before a release can ship a manifest it cannot honor.
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check workspace on MSRV
        run: cargo check --all-targets --all-features

  kmp-android-jvm:
    name: KMP bindings (Android + JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu runners ship the Android SDK preinstalled; just accept licenses
      # and add the platform the library compiles against.
      - name: Android SDK licenses + platform 36
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" >/dev/null
      - name: Compile Android + JVM targets
        working-directory: examples/android-demo
        run: ./gradlew :luciola:compileAndroidMain :luciola:compileKotlinJvm --no-daemon
      # jvmTest loads the host libluciola_uniffi.so via JNA from
      # <target>/release (hostNativeRoot in build.gradle.kts) — build it
      # first or the binding smoke test dies in UnsatisfiedLinkError.
      - name: Build host uniffi library
        run: cargo build -p luciola-uniffi --release
      - name: Run JVM binding tests
        working-directory: examples/android-demo
        run: ./gradlew :luciola:jvmTest --no-daemon

  kmp-ios:
    name: KMP bindings (iOS klib)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      # cinterop links against the staticlib, not against source: without these
      # two builds the task fails with
      #   Could not find 'libluciola_uniffi.a' binary in .../<triple>/release
      # The path is resolved by nativeRoot() in bindings/luciola-kmp/build.gradle.kts,
      # which falls back to the in-repo ./target on a runner.
      - name: Cross-compile uniffi static libs for iOS
        run: |
          cargo build -p luciola-uniffi --release --target aarch64-apple-ios
          cargo build -p luciola-uniffi --release --target aarch64-apple-ios-sim
      - name: Compile iOS targets
        working-directory: examples/android-demo
        run: ./gradlew :luciola:compileKotlinIosArm64 :luciola:compileKotlinIosSimulatorArm64 --no-daemon

  node-smoke:
    name: Node bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build native module
        run: cargo build -p luciola-node
      - name: Run smoke test
        run: node bindings/luciola-node/test.js
      - name: Run tunnel forwarding test
        run: node bindings/luciola-node/test/forward.test.mjs
      - name: Run runtime contract test
        run: node bindings/luciola-node/test/contract.test.mjs
      # Type-level contract: the .d.ts must match the documented call shapes.
      # typescript comes via npx (no devDependency / lockfile in the package).
      - name: Type-check the documented API surface
        run: npx --yes -p typescript@5 tsc --noEmit --strict --skipLibCheck --target es2020 --module commonjs bindings/luciola-node/test/api-consumer.ts

  ios-demo:
    name: iOS demo builds (Swift bindings)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build LuciolaUniFFI.xcframework
        run: ./bindings/luciola-swift/build-xcframework.sh
      - name: Generate Xcode project
        working-directory: examples/ios-demo
        run: xcodegen generate
      # Compile-only gate: this is what catches the demo drifting off the
      # generated Swift bindings (a constructor arity change used to leave
      # the demo broken with nothing in CI noticing).
      # ARCHS=arm64: the xcframework's simulator slice is
      # aarch64-apple-ios-sim only (see build-xcframework.sh) — without this
      # xcodebuild also builds an x86_64 slice and the link fails.
      - name: Build demo (iOS Simulator, compile-only)
        working-directory: examples/ios-demo
        run: xcodebuild build -project LuciolaRadar.xcodeproj -scheme LuciolaRadar -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
